name = "facultyos"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
BETTER_AUTH_URL = "https://facultyos.gs-softwares.workers.dev"
BETTER_AUTH_TRUSTED_ORIGINS = "https://facultyos.gs-softwares.workers.dev,https://*.workers.dev,https://facultyos.com,http://localhost:3000"

# Bindings are configured in Cloudflare Dashboard:
# Workers & Pages -> facultyos -> Settings -> Variables and Bindings:
# - D1 database: DB (facultyos)
# - KV namespace: RATE_LIMIT



