name = "facultyos"
main = "worker-entrypoint.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
BETTER_AUTH_URL = "https://facultyos.gs-softwares.workers.dev"
BETTER_AUTH_TRUSTED_ORIGINS = "https://facultyos.gs-softwares.workers.dev,https://*.workers.dev,https://facultyos.com,http://localhost:3000"

[[d1_databases]]
binding = "DB"
database_name = "facultyos"
database_id = "ca602aea-9aa7-4dec-acbe-b13d7ca2e99b"
migrations_dir = "drizzle"


[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b8c52c33c12d4f58a269807df91c69e8"

[[queues.producers]]
binding = "NOTIFICATIONS"
queue = "notifications"

[[queues.consumers]]
queue = "notifications"
max_batch_size = 10
max_batch_timeout = 5

[triggers]
crons = ["0 0 * * *", "0 8 * * 1", "0 2 * * *"]






